<!DOCTYPE html>
<html lang="en" data-theme="dark">
	<head>
		<meta charset="UTF-8" />
		<!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to
		     anything but 0. The mobile buy bar and the page gutters pad
		     themselves with it so nothing lands under a notch or a home bar. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<!-- Mirrors --canvas for the active theme; kept in sync by src/theme.ts. -->
		<meta name="theme-color" content="#161616" />
		<script>
			// Restore the stored theme BEFORE the first paint. Waiting for React to
			// mount would flash the default palette for a frame on every reload.
			// Deliberately duplicates src/theme.ts — keep the key, the default and
			// the chrome colours in step with it.
			(function () {
				var mode = "dark";
				try {
					var stored = localStorage.getItem("kolo.theme");
					if (stored === "dark" || stored === "light") mode = stored;
				} catch (error) {
					// Blocked storage — dark it is.
				}
				document.documentElement.dataset.theme = mode;
				var meta = document.querySelector('meta[name="theme-color"]');
				if (meta) meta.setAttribute("content", mode === "light" ? "#ffffff" : "#161616");
			})();
		</script>
		<link
			rel="icon"
			type="image/png"
			href="/logo.png"
			sizes="48x48"
		/>
		<title>Kolo</title>
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
